<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#120b08" />
    <meta
      name="description"
      content="同時抽出料理、餐點與吃法的晚餐拉霸；選項可自由挑選與新增，資料只留在你的裝置。"
    />
    <title>今晚吃什麼？｜三欄晚餐拉霸</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <h1 class="sr-only">今晚吃什麼？三欄晚餐拉霸</h1>

      <section class="slot-stage" aria-label="晚餐拉霸機">
        <div class="slot-machine" id="slot-machine">
          <div class="machine-bulbs" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i>
          </div>

          <div class="reel-housing">
            <article class="reel-column" data-reel="cuisine">
              <p class="reel-label">料理</p>
              <div class="reel-window">
                <div class="reel-content">
                  <span class="reel-icon" aria-hidden="true">🏷️</span>
                  <strong class="reel-value">輕食</strong>
                </div>
              </div>
            </article>

            <article class="reel-column" data-reel="meal">
              <p class="reel-label">餐點</p>
              <div class="reel-window">
                <div class="reel-content">
                  <span class="reel-icon" aria-hidden="true">⭐</span>
                  <strong class="reel-value">木盆沙拉</strong>
                </div>
              </div>
            </article>

            <article class="reel-column" data-reel="method">
              <p class="reel-label">吃法</p>
              <div class="reel-window">
                <div class="reel-content">
                  <span class="reel-icon" aria-hidden="true">🛍️</span>
                  <strong class="reel-value">內用</strong>
                </div>
              </div>
            </article>
          </div>

          <div class="result-summary" aria-live="polite" aria-atomic="true">
            <strong id="result-main">★ 木盆沙拉</strong>
            <span id="result-detail">輕食 · 內用</span>
          </div>

          <div class="machine-actions">
            <button class="spin-button" id="spin-button" type="button">
              <span class="button-idle">開抽</span>
              <span class="button-busy">抽選中…</span>
            </button>
            <button class="meal-only-button" id="meal-only-button" type="button">只換餐點</button>
          </div>
        </div>

        <button class="lever" id="lever" type="button" aria-label="拉下把手，開始抽選">
          <span class="lever-ball"></span>
          <span class="lever-stick"></span>
          <span class="lever-base"></span>
        </button>
      </section>

      <section class="options-panel" aria-labelledby="options-title">
        <div class="options-heading">
          <div>
            <h2 id="options-title">想抽哪些選項？</h2>
            <p>點選可排除，再點一次就加回來</p>
          </div>
          <button class="reset-button" id="reset-button" type="button">恢復預設</button>
        </div>

        <div class="category-tabs" role="tablist" aria-label="選項類別">
          <button
            class="category-tab is-active"
            id="tab-cuisine"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="options-content"
            data-group="cuisine"
          >
            料理 <span data-count="cuisine"></span>
          </button>
          <button
            class="category-tab"
            id="tab-meal"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="options-content"
            data-group="meal"
          >
            餐點 <span data-count="meal"></span>
          </button>
          <button
            class="category-tab"
            id="tab-method"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="options-content"
            data-group="method"
          >
            吃法 <span data-count="method"></span>
          </button>
        </div>

        <div
          class="options-content"
          id="options-content"
          role="tabpanel"
          aria-labelledby="tab-cuisine"
        >
          <div class="option-chips" id="option-chips"></div>

          <form class="add-option-form" id="add-option-form">
            <label class="sr-only" for="new-option">新增自訂選項</label>
            <input
              id="new-option"
              name="new-option"
              maxlength="18"
              autocomplete="off"
              placeholder="新增自訂料理，例如：港式"
            />
            <button type="submit">＋ 新增</button>
          </form>
          <p class="form-message" id="form-message" role="status"></p>
        </div>
      </section>

      <p class="privacy-note">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="10" width="14" height="10" rx="2"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        </svg>
        不用登入，選項只會儲存在這台裝置
      </p>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
